# Keep one instance: connection discovery is ephemeral and held in RAM.
services:
  - type: web
    name: share-and-drop
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
