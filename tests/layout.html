<!doctype html><html><head><meta charset="utf-8"><title>S&amp;D responsive QA</title><style>body{font:14px system-ui;background:#e5ebed;margin:20px;color:#173f32}button{padding:10px;margin-right:10px}iframe{border:1px solid #b6c9c0;width:390px;height:844px;background:white;display:block;margin-top:15px;border-radius:15px}pre{white-space:pre-wrap}</style></head><body><button data-width="360">360px phone</button><button data-width="390">390px phone</button><button data-width="768">768px tablet</button><button id="measure">Check overflow</button><pre id="result"></pre><iframe id="preview" title="Responsive S&amp;D preview" src="/"></iframe><script>const frame=document.getElementById('preview');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.getElementById('measure').onclick=()=>{const d=frame.contentDocument;document.getElementById('result').textContent=JSON.stringify({viewport:frame.clientWidth,documentWidth:d.documentElement.clientWidth,contentWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,buttons:[...d.querySelectorAll('button')].filter(b=>b.getBoundingClientRect().width>0).length},null,2);};</script></body></html>
